[build]
    command = "npm run build"
    publish = "dist"

[[redirects]]
    from = "/*"
    to = "index.html"
    status = 200
    force = true

[[headers]]
    for = "/*"
    [headers.values]
        X-Frame-Options = "DENY"
        X-XSS-Protection = "1; mode=block"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 https://*.koyeb.app;"

[[headers]]
    for = "/index.html"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"